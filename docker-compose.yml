version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: n8n-workflows-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: n8n-workflows
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - n8n-network

  n8n-crawler:
    build: .
    container_name: n8n-workflow-crawler
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/n8n-workflows
      - NODE_ENV=production
    depends_on:
      - mongodb
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    networks:
      - n8n-network
    command: ["npm", "start", "health"]

volumes:
  mongodb_data:

networks:
  n8n-network:
    driver: bridge
